# amnesia — dedicated public SearXNG backend for https://api.amnesia.tax
#
# Standalone stack, intentionally separate from the askalf platform stack.
# - amnesia-searxng : public-facing SearXNG (JSON API consumed by the static
#                     front-end at https://amnesia.tax)
# - amnesia-valkey  : backing store for the SearXNG limiter (rate/bot control)
#
# Outbound search-engine traffic egresses through the platform's ProtonVPN
# gluetun HTTP proxy (gluetun:8888) over the shared external `askalf-net`
# network, so search providers never see the host's datacenter IP.
#
# Deployed to /root/amnesia on the Hetzner host (see DEPLOY.md). The host's
# cloudflared (systemd) routes api.amnesia.tax -> 127.0.0.1:8081.

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: amnesia-valkey
    command: >-
      valkey-server
      --save 30 1
      --loglevel warning
      --requirepass ${AMNESIA_VALKEY_PASSWORD}
    networks:
      - amnesia-net
    volumes:
      - amnesia_valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $${AMNESIA_VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  searxng:
    # Pinned to the same known-good digest the platform stack runs.
    image: searxng/searxng@sha256:1a143665b6445079d1cd5b6facdf599d22ac9c29698dd2e7d15eb9b5f5a854cc
    container_name: amnesia-searxng
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      # Loopback-only: the host cloudflared reaches the container here.
      - "127.0.0.1:8081:8080"
    environment:
      SEARXNG_SECRET: ${AMNESIA_SEARXNG_SECRET}
      SEARXNG_VALKEY_URL: redis://:${AMNESIA_VALKEY_PASSWORD}@valkey:6379/0
      SEARXNG_BASE_URL: https://api.amnesia.tax/
      # Egress every engine request through the platform ProtonVPN proxy.
      HTTP_PROXY: http://gluetun:8888
      HTTPS_PROXY: http://gluetun:8888
      NO_PROXY: localhost,127.0.0.1,valkey,amnesia-valkey
    volumes:
      - ./searxng:/etc/searxng:ro
      - amnesia_searxng_cache:/var/cache/searxng
    networks:
      - amnesia-net
      - askalf-net   # external — provides DNS for gluetun:8888
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  amnesia-net:
    name: amnesia-net
    driver: bridge
  askalf-net:
    # The platform stack's network. Confirm the real name on the host with
    # `docker network ls | grep askalf-net` and set ASKALF_NET_NAME in .env.
    external: true
    name: ${ASKALF_NET_NAME:-askalf_askalf-net}

volumes:
  amnesia_valkey_data:
    name: amnesia_valkey_data
  amnesia_searxng_cache:
    name: amnesia_searxng_cache
