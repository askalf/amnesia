# SearXNG settings — PUBLIC instance behind https://api.amnesia.tax
#
# Tuned variant of the internal askalf search config:
#  - limiter + public_instance OFF — both silently return ZERO results behind
#    cloudflared (every request arrives from the tunnel's IP). Rate/bot defense
#    lives at the Cloudflare edge instead. Do not re-enable without re-testing
#    search through the tunnel.
#  - base_url set so generated links/JSON are correct
#  - json format KEPT (the amnesia.tax front-end calls /search?...&format=json)
#  - all engine traffic egresses through ProtonVPN via gluetun:8888
#
# Cloudflare provides the primary edge hardening (Turnstile gate Worker, rate
# limiting, WAF) and the CORS response header — see infra/DEPLOY.md.

use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "amnesia.tax"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  base_url: "https://api.amnesia.tax/"
  limiter: false
  public_instance: false
  image_proxy: true
  method: "GET"
  http_protocol_version: "1.1"

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 50
  enable_http2: true
  retries: 2
  retry_on_http_error: true
  proxies:
    all://:
      - http://gluetun:8888
      - http://gluetun:8888

favicons:
  cfg_schema: 1
  cache:
    db_url: "/var/cache/searxng/faviconcache.db"
    LIMIT_TOTAL_BYTES: 52428800
    HOLD_TIME: 5184000
    BLOB_MAX_BYTES: 40960
  proxy:
    max_age: 5184000

engines:
