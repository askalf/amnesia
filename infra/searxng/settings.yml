# SearXNG settings — PUBLIC instance behind https://api.amnesia.tax
#
# Security/perf-tuned 2026-05-30. Authoritative config (regenerated clean to
# drop a duplicate engine + stale comments).
#
# Abuse control is delegated to the Cloudflare edge + the Turnstile Worker that
# fronts api.amnesia.tax — see worker/DEPLOY.md. The SearXNG `limiter` and
# `public_instance` are OFF: behind cloudflared SearXNG can't identify clients
# from the forwarded IP chain and silently returns 0 results for proxied JSON
# requests when they're on.
#
# Egress: the live stack (docker-compose.vpn.yml) runs SearXNG inside gluetun's
# network namespace, so engine traffic leaves by the ProtonVPN tunnel with no
# proxy setting at all. There is deliberately no `outgoing.proxies` here: in
# that shape it only added an HTTP CONNECT relay (gluetun:8888) in front of
# every engine connection. The rollback shape (docker-compose.yml) still needs
# the proxy and mounts ../searxng-proxy/settings.yml, generated from this file
# by scripts/searxng-proxy-settings.mjs — edit this file, then run it --write.
#
# Metrics: /stats and /stats/errors (per-engine timing, error and timeout
# counts) are on. They are not public: the Worker forwards only /search and
# /autocompleter to the origin, and the origin hostname is WAF-locked to the
# Worker, so they are reachable only on the host at 127.0.0.1:8081.

use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "amnesia.tax"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true         # /stats on host loopback only — see header

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  base_url: "https://api.amnesia.tax/"
  limiter: false               # see header — Cloudflare/Worker is the gate
  public_instance: false
  image_proxy: true            # proxy result thumbnails so engines never see the user
  method: "GET"
  http_protocol_version: "1.1"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: true
  infinite_scroll: false

outgoing:
  # A search waits for its slowest selected engine, so the deadline is the
  # largest timeout among them. Enabled engines share this one (the few whose
  # upstream default is longer are pinned to it below); healthy engines answer
  # well under 1.5 s (see /stats).
  # Raise a single engine's `timeout` only if /stats shows it timing out while
  # still being worth waiting for.
  request_timeout: 3.0
  max_request_timeout: 5.0     # caps ?timeout_limit= from a client
  useragent_suffix: ""
  # Perf: large pools so ~40 engines query concurrently without head-of-line
  # blocking (host: 4 CPU / ~5 GB free). keepalive reuses engine connections.
  pool_connections: 100
  pool_maxsize: 50
  keepalive_expiry: 30.0
  enable_http2: true
  # No retries: a retry runs inside the same deadline, so a timed-out engine
  # cannot finish anyway and a retry only doubles the load on a struggling one.
  # A keep-alive connection the server dropped is still retried once by
  # SearXNG regardless of this. (`retry_on_http_error` is only read per engine,
  # never from `outgoing`, so the old global `true` did nothing.)
  retries: 0

favicons:
  cfg_schema: 1
  cache:
    db_url: "/var/cache/searxng/faviconcache.db"
    LIMIT_TOTAL_BYTES: 52428800
    HOLD_TIME: 5184000
    BLOB_MAX_BYTES: 40960
  proxy:
    max_age: 5184000

engines:
  # ============================================
  # GENERAL — reliable through a VPN exit IP
  # ============================================
  - name: brave
    disabled: false   # re-enabled 2026-06-29 — verified working behind VPN
    weight: 3.0

  - name: bing
    disabled: false   # re-enabled 2026-06-29 — verified working behind VPN
    weight: 2.5

  - name: duckduckgo
    disabled: false
    weight: 2.5

  - name: startpage
    disabled: true   # chronic CAPTCHA behind VPN (9x/48h, 600s suspensions) and the slowest engine — 2026-07-02
    weight: 2.0
    timeout: 8.0

  - name: yahoo
    disabled: true   # chronic Server-disconnected behind VPN - 2026-06-21
    weight: 1.5
    timeout: 6.0

  - name: yandex
    disabled: false
    weight: 1.0

  - name: presearch
    disabled: true    # 2026-08-15: 7/7 probe timeouts, zero results behind VPN; its 2-step token+query flow ignores the engine timeout and pinned every search at ~5.2s
    weight: 1.0
    timeout: 3.0

  # ============================================
  # GENERAL — VPN-flaky (self-suspend on 403, low cost to keep)
  # ============================================
  - name: google
    disabled: true   # blocks datacenter/VPN IPs (403) — 2026-06-20
    weight: 0.5
    timeout: 5.0
    use_mobile_ui: true

  - name: mojeek
    disabled: true   # blocks datacenter/VPN IPs (403) — 2026-06-20
    weight: 0.5
    timeout: 6.0

  - name: qwant
    disabled: true   # blocks datacenter/VPN IPs (403) — 2026-06-20
    weight: 0.5
    timeout: 6.0

  - name: crowdview
    disabled: false
    weight: 0.3

  - name: searchmysite
    disabled: false
    weight: 0.3

  # ---- DISABLED: the same providers' other verticals ----
  # use_default_settings keeps every upstream engine that is on by default, so
  # these ran on image/news/video searches even though their web engines above
  # are off for blocking VPN/datacenter IPs. Same reason, same date as those.
  # 2026-09-23
  - name: google images
    disabled: true
  - name: google videos
    disabled: true
  - name: google cse
    disabled: true
  - name: google cse images
    disabled: true
  - name: qwant news
