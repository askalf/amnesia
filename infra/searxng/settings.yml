  - name: mojeek images
    disabled: true
  - name: mojeek news
    disabled: true

  # ---- DISABLED: permanently broken, not VPN-flaky (waste every query) ----
  - name: ask          # returns HTTP 404 on every request
    disabled: true
  - name: yep          # API returns 501 Not Implemented
    disabled: true
  - name: mwmbl        # response parser crashes (IndexError)
    disabled: true
  - name: wiby         # frequently times out, near-zero useful results
    disabled: true

