# SearXNG settings — PUBLIC instance behind https://api.amnesia.tax
#
# Security/perf-tuned 2026-05-30. Authoritative config (regenerated clean to
# drop a duplicate engine + stale comments).
#
# Abuse control is delegated to the Cloudflare edge + the Turnstile Worker that
# fronts api.amnesia.tax — see worker/DEPLOY.md. The SearXNG `limiter` and
# `public_instance` are OFF: behind cloudflared SearXNG can't identify clients
# from the forwarded IP chain and silently returns 0 results for proxied JSON
# requests when they're on. All engine traffic egresses through ProtonVPN via
# gluetun:8888.

use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "amnesia.tax"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false        # don't expose /stats timing to the public

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  base_url: "https://api.amnesia.tax/"
  limiter: false               # see header — Cloudflare/Worker is the gate
  public_instance: false
  image_proxy: true            # proxy result thumbnails so engines never see the user
  method: "GET"
  http_protocol_version: "1.1"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: true
  infinite_scroll: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  # Perf: large pools so ~40 engines query concurrently without head-of-line
  # blocking (host: 4 CPU / ~5 GB free). keepalive reuses gluetun connections.
  pool_connections: 100
  pool_maxsize: 50
  keepalive_expiry: 30.0
  enable_http2: true
  retries: 1
  retry_on_http_error: true
  proxies:
    all://:
      - http://gluetun:8888

favicons:
  cfg_schema: 1
  cache:
    db_url: "/var/cache/searxng/faviconcache.db"
    LIMIT_TOTAL_BYTES: 52428800
    HOLD_TIME: 5184000
    BLOB_MAX_BYTES: 40960
  proxy:
    max_age: 5184000

engines:
  # ============================================
  # GENERAL — reliable through a VPN exit IP
  # ============================================
  - name: brave
    disabled: false   # re-enabled 2026-06-29 — verified working behind VPN
    weight: 3.0
    timeout: 6.0

  - name: bing
    disabled: false   # re-enabled 2026-06-29 — verified working behind VPN
    weight: 2.5
    timeout: 6.0

  - name: duckduckgo
    disabled: false
    weight: 2.5
    timeout: 6.0

  - name: startpage
    disabled: true   # chronic CAPTCHA behind VPN (9x/48h, 600s suspensions) and the slowest engine — 2026-07-02
    weight: 2.0
    timeout: 8.0

  - name: yahoo
    disabled: true   # chronic Server-disconnected behind VPN - 2026-06-21
    weight: 1.5
    timeout: 6.0

  - name: yandex
    disabled: false
    weight: 1.0
    timeout: 6.0

  - name: presearch
    disabled: false   # re-enabled 2026-06-29 — verified working behind VPN
    weight: 1.0
    timeout: 6.0

  # ============================================
  # GENERAL — VPN-flaky (self-suspend on 403, low cost to keep)
  # ============================================
  - name: google
    disabled: true   # blocks datacenter/VPN IPs (403) — 2026-06-20
    weight: 0.5
    timeout: 5.0
    use_mobile_ui: true

  - name: mojeek
