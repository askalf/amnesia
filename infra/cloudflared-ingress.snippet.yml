# Add this ingress rule to the backend host's cloudflared config
# (/etc/cloudflared/config.yml) ABOVE the final `service: http_status:404`
# catch-all, then `systemctl restart cloudflared`.
#
# amnesia-origin.sprayberrylabs.com is the hostname the API gate Worker proxies to; the
# public amnesia-api.sprayberrylabs.com is the Worker's route and needs no ingress of its own.
# It rides the host's existing tunnel (a tunnel can serve hostnames
# across multiple zones in the same CF account). DNS: a proxied CNAME
# amnesia-origin.sprayberrylabs.com -> <tunnel-id>.cfargotunnel.com, created via
# `cloudflared tunnel route dns <tunnel> amnesia-origin.sprayberrylabs.com`.
# Lock it to the Worker with the WAF rule in worker/DEPLOY.md step 4.

  - hostname: amnesia-origin.sprayberrylabs.com
    service: http://localhost:8081
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
