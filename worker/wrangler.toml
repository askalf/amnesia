# amnesia API gate Worker — fronts api.amnesia.tax, verifies Turnstile, proxies SearXNG.
#
# Deploy:  cd worker && wrangler deploy
# Secrets (set once, NOT in this file):
#   wrangler secret put TURNSTILE_SECRET   # Turnstile secret key (siteverify)
#   wrangler secret put ORIGIN_SECRET      # shared header to reach the origin
#   wrangler secret put SESSION_SECRET     # HMAC key for the session cookie (openssl rand -hex 32)
#
# The route binds api.amnesia.tax/* to this Worker. That means api.amnesia.tax
# must be a DNS record in the zone (it is — proxied CNAME to the tunnel) AND the
# Worker route takes precedence for matching requests. See worker/DEPLOY.md.

name = "amnesia-api-gate"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = false

account_id = "dfdf9f7ec6fe9f816bd9cdc6f2469eca"

# Public vars (non-secret)
[vars]
ALLOWED_ORIGIN = "https://amnesia.tax"
# The SearXNG origin the Worker proxies to — a SEPARATE tunnel hostname that is
# NOT the public api host and NOT challenge-gated against the Worker. Provision
# per worker/DEPLOY.md (cloudflared ingress search-origin.amnesia.tax -> :8081).
ORIGIN_HOST = "https://search-origin.amnesia.tax"
# Session cookie lifetime in seconds (Turnstile solved once, then skipped).
# 6h (was 30min): the cookie is just an HMAC-signed expiry — nothing
# user-identifying — so a longer life cuts re-challenges at negligible risk.
SESSION_TTL = "21600"
# Egress IP(s) of the trusted front-end-verification bridge (the platform box).
# Requests from these IPs skip Turnstile — the headless bridge can't solve it
# from a datacenter IP. Comma-separated; not a secret. Empty disables the bypass.
BRIDGE_IPS = "178.104.181.103"

# Route: take over api.amnesia.tax for the Worker.
[[routes]]
pattern = "api.amnesia.tax/*"
zone_name = "amnesia.tax"
