# SearXNG settings — the SELF-HOST image (ghcr.io/askalf/amnesia).
#
# The hosted instance's tuning (infra/searxng/settings.yml) minus the parts
# that only make sense on amnesia.tax:
#   - no outgoing proxy: the hosted instance egresses through ProtonVPN via
#     gluetun; here engine traffic leaves from YOUR host's IP. To put a VPN
#     under it, run the image inside a gluetun network namespace — the shape
#     infra/docker-compose.vpn.yml uses.
#   - the engines amnesia.tax disables only because they block datacenter/VPN
#     exit IPs (google, mojeek, qwant, startpage, yahoo, wolframalpha, google
#     news, google scholar) are ON. From an IP they accept, they answer; from
#     one they refuse, SearXNG suspends them (ban_time_on_fail) and moves on.
#   - no base_url: SearXNG derives it from the request (set SEARXNG_BASE_URL
#     when a reverse proxy rewrites the host).
#   - secret_key is the literal ultrasecretkey on purpose: SearXNG refuses to
#     start with it, and image/entrypoint.sh always supplies SEARXNG_SECRET
#     (random per container). A run that bypasses the entrypoint fails closed
#     instead of signing image-proxy URLs with a key published here.
#
# limiter/public_instance are OFF, as on the hosted instance, where abuse
# control is Cloudflare + the Turnstile Worker. This image has no gate: it is
# meant for one person or a household. Exposed to the internet, put a gate or
# a rate limit in front of it.
#
# Engines permanently broken for everyone (ask, yep, mwmbl, wiby) and
# presearch (its two-step flow ignores the engine timeout and pins every
# search at ~5 s when it stalls) stay off. Weights are the hosted instance's.
# Timeouts are too: every engine shares the 3 s request_timeout, and the few
# whose upstream default is longer are pinned to it, because a search waits
# for its slowest engine. That includes the engines enabled only here: from a
# home IP google, startpage and the rest answer inside 3 s or not usefully.

use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "amnesia"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120

server:
  secret_key: "ultrasecretkey"   # replaced by SEARXNG_SECRET — see the header
  limiter: false
  public_instance: false
  # Proxies thumbnails in SearXNG's own HTML pages. It does not touch the JSON
  # the amnesia page reads (webutils.get_json_response never proxifies), so
  # thumbnails there still load from each image's host.
  image_proxy: true
  method: "GET"
  http_protocol_version: "1.1"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: true
  infinite_scroll: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 5.0     # caps ?timeout_limit= from a client
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 50
  keepalive_expiry: 30.0
  enable_http2: true
  # No retries: a retry runs inside the same deadline. (`retry_on_http_error`
  # is only read per engine, never from `outgoing`.)
  retries: 0

engines:
  # ---- GENERAL ----
  - name: brave
    disabled: false
    weight: 3.0

  - name: bing
    disabled: false
    weight: 2.5

  - name: duckduckgo
    disabled: false
    weight: 2.5

  - name: google
    disabled: false
    weight: 0.5
    use_mobile_ui: true

  - name: startpage
    disabled: false
    weight: 2.0

  - name: qwant
    disabled: false
    weight: 0.5

  - name: yahoo
    disabled: false
    weight: 1.5

  - name: mojeek
    disabled: false
    weight: 0.5

  - name: yandex
    disabled: false
    weight: 1.0

  - name: crowdview
    disabled: false
    weight: 0.3

  - name: searchmysite
    disabled: false
    weight: 0.3

  - name: presearch
    disabled: true    # two-step flow ignores the engine timeout; pins searches at ~5 s when it stalls
    weight: 1.0
    timeout: 3.0

  # ---- permanently broken, for everyone ----
  - name: ask          # HTTP 404 on every request
    disabled: true
  - name: yep          # API returns 501 Not Implemented
    disabled: true
  - name: mwmbl        # response parser crashes (IndexError)
    disabled: true
  - name: wiby         # frequent timeouts, near-zero useful results
    disabled: true

  # ---- KNOWLEDGE ----
  - name: wikipedia
    disabled: false
    weight: 2.0

  - name: wikidata
    disabled: false

  - name: wolframalpha
    disabled: false
    timeout: 3.0     # upstream default is 6.0 s

  - name: currency
    disabled: false

  - name: ddg definitions
    disabled: false

  # ---- NEWS ----
  - name: brave.news
    disabled: false
    weight: 2.5

  - name: bing news
    disabled: false
    weight: 2.0

  - name: google news
    disabled: false
    weight: 0.5

  - name: duckduckgo news
    disabled: false
    weight: 1.5

  - name: yahoo news
    disabled: false
    weight: 1.0

  - name: wikinews
    disabled: false

  # ---- DEV / IT ----
  - name: github
    disabled: false
    weight: 2.0

  - name: gitlab
    disabled: false

  - name: stackoverflow
    disabled: false
    weight: 2.0

  - name: npm
    disabled: false
    timeout: 3.0     # upstream default is 5.0 s; would set the IT-search deadline

  - name: pypi
    disabled: false

  - name: docker hub
    disabled: false

  - name: crates.io
    disabled: false
    timeout: 3.0     # upstream default is 6.0 s; would set the IT-search deadline

  - name: hackernews
    disabled: false
    weight: 1.5

  - name: lobste.rs
    disabled: false
    timeout: 3.0     # upstream default is 5.0 s; would set the IT-search deadline

  - name: mdn
    disabled: false

  - name: arch linux wiki
    disabled: false

  - name: huggingface
    disabled: false

  - name: national vulnerability database
    disabled: false

  # ---- SCIENCE / ACADEMIC ----
  - name: arxiv
    disabled: false

  - name: semantic scholar
    disabled: false

  - name: google scholar
    disabled: false
    weight: 1.0

  - name: pubmed
    disabled: false

  # ---- SOCIAL ----
  - name: reddit
    disabled: false
    weight: 1.5

  - name: mastodon hashtags
    disabled: false

  - name: mastodon users
    disabled: false

  - name: lemmy posts
    disabled: false

  # ---- IMAGES ----
  - name: brave.images
    disabled: false
    weight: 2.0

  - name: bing images
    disabled: false

  - name: duckduckgo images
    disabled: false

  - name: unsplash
    disabled: false

  # ---- VIDEOS ----
  - name: brave.videos
    disabled: false
    weight: 2.0

  - name: youtube
    disabled: false

  - name: odysee
    disabled: false

  # ---- MAPS ----
  - name: openstreetmap
    disabled: false

  # ---- upstream defaults longer than 3 s (on by default; pinned as hosted) ----
  - name: gentoo
    timeout: 3.0     # upstream default is 10 s; would set the IT-search deadline

  - name: openairedatasets
    timeout: 3.0     # upstream default is 5.0 s; would set the science-search deadline

  - name: openairepublications
    timeout: 3.0     # upstream default is 5.0 s; would set the science-search deadline

  - name: artic
    timeout: 3.0     # upstream default is 4.0 s; would set the image-search deadline

  # ---- the rest of upstream's on-by-default engines with a default over 3 s ----
  # (files, translation, dictionary, weather): pinned so none of them sets the
  # deadline of the searches they join.
  - name: kickass
    timeout: 3.0     # upstream default is 4.0 s

  - name: solidtorrents
    timeout: 3.0     # upstream default is 4.0 s

  - name: mymemory translated
    timeout: 3.0     # upstream default is 5.0 s

  - name: wordnik
    timeout: 3.0     # upstream default is 5.0 s

  - name: wttr.in
    timeout: 3.0     # upstream default is 9.0 s
