name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes to main must not deploy Pages concurrently and land out of order.
# Queue rather than cancel, matching deploy-worker.yml: an interrupted deploy
# leaves a half-applied state, which is worse than a late one.
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      deployments: write # wrangler-action records a GitHub deployment
    runs-on: [self-hosted, amnesia]
    # Bounds the amnesia runner's single slot. Without it the job inherits
    # GitHub's 360-minute default, so one wedged deploy blocks every later one
    # for six hours. Sized from observed runs (well under a minute) the same
    # way deploy-worker.yml's 5 was.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp src/amnesia-search.html deploy/index.html
          cp src/og.png deploy/og.png 2>/dev/null || true
          cp src/robots.txt deploy/robots.txt 2>/dev/null || true
          cp src/sitemap.xml deploy/sitemap.xml 2>/dev/null || true
          cp src/_headers deploy/_headers 2>/dev/null || true
          cp -r src/fonts deploy/fonts   # self-hosted Space Mono (hard fail if missing — the CSP no longer allows Google Fonts)

      - name: Deploy amnesia.tax
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"  # pin wrangler (was floating @latest; no package.json); 4.100.0 was live during the last good deploy 2026-06-12
          command: pages deploy deploy --project-name=amnesia-site --branch=main
