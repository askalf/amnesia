name: Sponsors README sync

# The $25+ GitHub Sponsors tiers promise a line in the README. Once a day,
# rebuild the marked block from the public sponsor list (scripts/sponsors.mjs)
# and open a PR when it changed. A PR, not a push: README changes go through
# review like everything else. Private sponsors are never named.

on:
  schedule:
    # 06:53 UTC daily, off the hour.
    - cron: '53 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsors-readme
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'askalf/amnesia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Rebuild the README sponsors block
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --write exits 1 when the sponsor list could not be read, so a
          # broken read never becomes an empty list in a PR.
          node scripts/sponsors.mjs --write
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "README sponsors block unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- README.md
          fi

      - name: Open or refresh the PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="bot/sponsors-readme"
          git config user.email "actions@github.com"
          git config user.name "sponsors-readme[bot]"
          git checkout -B "$branch"
          git add README.md
          git commit -m "README: sponsors block refreshed $(date -u +%Y-%m-%dT%H:%MZ)"
          # One long-lived branch, force-pushed: the block is derived state,
          # so the newest run is the only one worth reviewing.
          git push --force origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "refreshed #$existing"
            exit 0
          fi
          # shellcheck disable=SC2016
          gh pr create --head "$branch" --base main \
            --title "README: sponsors block refreshed" \
            --body 'The public sponsor list changed; this is the README block rebuilt from it by `scripts/sponsors.mjs`. Private sponsors are never named.'
