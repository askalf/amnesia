name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A PR's runs share one group per branch, so a new push cancels the superseded
# run. Push and schedule runs each get their own group (the run id): GitHub keeps
# only one pending run per group, so a shared group would let a newer push
# replace a queued default-branch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # GitHub-hosted, NOT self-hosted: this job runs on pull_request, including
    # from forks (public repo). Running untrusted fork code on the self-hosted
    # runner — which lives on the production box — is a remote code-exec path.
    # Keep PR-triggered CI on ephemeral GH runners; only the deploy workflows
    # (push to main, no fork exposure) use the self-hosted runner.
    runs-on: ubuntu-latest
    # The job name is the branch ruleset's required status check. Renaming it
    # leaves every open PR waiting on a check that never reports.
    name: Validate HTML and Scripts
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Tests (API gate + SPA guards)
        # Zero dependencies: node:test drives the Worker's real default export
        # and runs the SPA's safeUrl/escapeAttr from the page's own bytes.
        run: npm test

      - name: CSP hashes match the SPA
        # src/_headers allows the page's inline <script>/<style> by hash. A
        # change to either block without regenerating the header ships a
        # page whose script the browser refuses to run — "search does
        # nothing", no error a user would see. Fix: node scripts/csp-hashes.mjs --write
        run: node scripts/csp-hashes.mjs --check

      - name: README and docs links resolve
        run: node scripts/check-readme-links.mjs

      - name: XML files are well-formed
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          for f in ('src/sitemap.xml', 'src/opensearch.xml'):
              ET.parse(f)
              print(f'ok  {f}')
          EOF

  scorecard-local:
    # The repo is at OpenSSF Scorecard 9.5. Four of its checks are read
    # straight from the files in this tree, so a PR can lower them before the
    # nightly Scorecard run ever sees it: an unpinned action, a write token at
    # the top of a workflow, a dangerous trigger, a committed binary. This job
    # scores the PR's own tree and fails on anything below 10.
    name: Scorecard (file-based checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Scorecard (release binary, checksum-pinned)
        # The gcr.io/openssf/scorecard image refuses pulls (its registry
        # project has billing disabled), so the release tarball is used
        # instead, verified against the SHA-256 published in the release's
        # scorecard_checksums.txt.
        env:
          SCORECARD_VERSION: 5.5.0
          SCORECARD_SHA256: 83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff
        run: |
          set -euo pipefail
          curl -sSfL --max-time 60 -o "$RUNNER_TEMP/scorecard.tgz" \
            "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          echo "${SCORECARD_SHA256}  $RUNNER_TEMP/scorecard.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/scorecard.tgz" -C "$RUNNER_TEMP" scorecard

      - name: Pinned-Dependencies, Token-Permissions, Dangerous-Workflow and Binary-Artifacts stay at 10
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/scorecard" --local=. \
            --checks=Pinned-Dependencies,Token-Permissions,Dangerous-Workflow,Binary-Artifacts \
            --format=json > "$RUNNER_TEMP/scorecard.json"
          jq -r '.checks[] | "\(.score)\t\(.name)\t\(.reason)"' "$RUNNER_TEMP/scorecard.json"
          # -1 counts as a failure too: it means the check found nothing to
          # score, which on this tree means it did not see the workflows.
          low=$(jq '[.checks[] | select(.score != 10)] | length' "$RUNNER_TEMP/scorecard.json")
          if [ "$low" != "0" ]; then
            echo "::error::$low Scorecard check(s) below 10 on this tree. Run '$RUNNER_TEMP/scorecard --local=. --show-details' (or read the table above) to see which line lowered it."
            "$RUNNER_TEMP/scorecard" --local=. \
              --checks=Pinned-Dependencies,Token-Permissions,Dangerous-Workflow,Binary-Artifacts \
              --show-details | grep -E 'Warn:' || true
            exit 1
          fi
