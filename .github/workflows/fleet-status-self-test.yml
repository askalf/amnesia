# Checks this repository's fleet-status workflows with askalf/ci's fleet-status-check action: the
# refresh list in fleet-status.yml against every workflow that runs on pull requests, the status
# job's if: against fork and same-repo events, every runs-on that names our runner label, and the
# review relay. The workflows are read as text from the PR's checkout with a read-only token;
# nothing in them runs.
# self-test is a required check here. A required check that never reports holds the merge, so
# it runs on every pull request, not only on those that change a workflow.
name: Fleet status self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  self-test:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on amnesia-exec, our non-root
    # one-job runners, so GitHub's hosted queue going down does not hold our PRs. A fork's PR
    # and a Dependabot PR run code nobody here wrote, and a fork repository has no amnesia-exec
    # runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/amnesia' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","amnesia-exec"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@b3ace54b455a479b01e25c82f98e98a2212699a4 # main 2026-11-09, askalf/ci#196
        with:
          persist-credentials: false

      - uses: askalf/ci/actions/fleet-status-check@b3ace54b455a479b01e25c82f98e98a2212699a4 # main 2026-11-09, askalf/ci#196
        with:
          min-own-exprs: '4'
          repo-only: fleet-status.yml fleet-status-backfill.yml canary.yml release.yml sponsors-readme.yml
