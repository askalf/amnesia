# CodeQL — GitHub's semantic code-scanning engine. Advanced setup (this file)
# is the chosen path; code-scanning default setup stays not-configured, since
# the two conflict. Scans the SPA render/auth JS (src/amnesia-search.html), the
# Worker HMAC/session code (worker/src/index.js), and the Actions workflows.
# CodeQL is free on public repos.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # weekly, Monday 06:23 UTC (staggered off the :00 grid)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL runs on GitHub's runners: it sizes itself to the machine, and the exec runners of
    # every repo share one host, so concurrent analyses would exhaust its memory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF results to code scanning
      contents: read # checkout the source
      actions: read # analyze the Actions workflows

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: askalf/ci/actions/checkout-with-retry@9e4fe74e2f24173da83d2e1b7002556a8e1eaa02 # main 2026-10-24, askalf/ci#132

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
