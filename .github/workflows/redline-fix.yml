# Redline fix: when Redline requests changes on a pull request here, forge dispatches this run
# with the PR, the head Redline reviewed and the review. The fix itself is computed by
# askalf/ci (redline-fix-run.yml) on this repository's non-root exec runner and uploaded as
# the redline-fix artifact. Nothing here pushes or comments, and no token that could is on the
# runner: forge verifies the artifact and pushes the fix to the PR branch with its own token.
name: Redline fix
run-name: Redline fix ${{ github.repository }}#${{ inputs.pr }} @ ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number.
        required: true
        type: string
      head:
        description: The full commit sha Redline reviewed. The run fails if the PR has moved past it.
        required: true
        type: string
      review:
        description: URL of the REQUEST_CHANGES review being answered.
        required: true
        type: string
      dry_run:
        description: Compute the fix and upload its diff; no commit, no bundle.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

# No concurrency group: a group holds one pending run and cancels the one before it, and a
# cancelled run leaves no artifact for forge to read. Forge serializes instead: it dispatches no
# run at a head while another run there is queued or running, and a run whose head the PR has
# moved past fails before it computes anything. Runs waiting for the exec runner queue on it.

jobs:
  fix:
    # Pinned so a change to the fix workflow reaches this repo only through a reviewed bump here.
    uses: askalf/ci/.github/workflows/redline-fix-run.yml@3ff81710acee0124cebda98e6400787035280a99 # main 2026-10-10, askalf/ci#42
    with:
      redline-ref: 3ff81710acee0124cebda98e6400787035280a99
      # amnesia-exec is this repository's ephemeral exec runner: its own non-root account, one job
      # per registration, no credential but the fix lane's own model key.
      runner-label: amnesia-exec
      pr: ${{ inputs.pr }}
      head: ${{ inputs.head }}
      review: ${{ inputs.review }}
      dry_run: ${{ inputs.dry_run }}
