# Manual: posts the fleet review-lane statuses on every open same-repo PR. Run it right after
# the fleet/* contexts become required checks, so PRs opened before that report.
name: Fleet status backfill

on:
  workflow_dispatch:

permissions: {}

jobs:
  backfill:
    # Dispatch only, so only our own branches run here: on amnesia-exec, a backfill of the
    # fleet/verify and fleet/review statuses does not wait on GitHub's hosted queue.
    # A fork repository has no amnesia-exec runners, so there it runs on GitHub's.
    runs-on: ${{ github.repository == 'askalf/amnesia' && fromJSON('["self-hosted","amnesia-exec"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@c15f1083cee9da50beda97158e393d0c46afb177 # main 2026-10-21, askalf/ci#91
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/fleet-status.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Post the lane statuses on every open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # gh pages past 100 on its own; at the cap, fail rather than skip PRs silently.
          all="$(gh pr list --repo "$REPO" --state open --limit 1000 --json number,isCrossRepository)"
          if [ "$(printf '%s' "$all" | jq 'length')" -ge 1000 ]; then
            echo "::error::1000 or more open PRs; raise the backfill limit"
            exit 1
          fi
          prs="$(printf '%s' "$all" | jq -r '.[] | select(.isCrossRepository | not) | .number')"
          for pr in $prs; do
            echo "== #$pr"
            PR="$pr" node scripts/fleet-status.mjs
          done
