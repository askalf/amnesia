# Daily canary: catch a dead/expiring deploy token and a broken live site
# BEFORE a deploy fails on them.
#
# Why: the repo's CLOUDFLARE_API_TOKEN keeps dying from short expiry (06-09,
# 06-10, then mid-week 06-14) — the first symptom is a red deploy after merge.
# A red canary run is a much earlier, cheaper signal. It runs DAILY (was weekly,
# Mondays): a Monday-only canary missed the 06-14 mid-week death entirely, and
# daily makes the token's <14-day expiry check below an actual early warning.
#
# GitHub-hosted on purpose: scheduled runs need no repo checkout and should not
# touch the self-hosted production runner. Free on a public repo.

name: Canary

on:
  schedule:
    - cron: '17 14 * * *'   # daily 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-token:
    name: Verify deploy token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token is active and not near expiry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --max-time 20 https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ok=$(echo "$resp" | jq -r '.success')
          status=$(echo "$resp" | jq -r '.result.status // "unknown"')
          if [ "$ok" != "true" ] || [ "$status" != "active" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is NOT active (success=$ok status=$status) — deploys will fail. Re-issue per the recipe in infra/DEPLOY.md step 5 and update the repo secret."
            echo "$resp" | jq '.errors // empty'
            exit 1
          fi
          exp=$(echo "$resp" | jq -r '.result.expires_on // empty')
          if [ -n "$exp" ]; then
            exp_s=$(date -d "$exp" +%s)
            now_s=$(date +%s)
            days=$(( (exp_s - now_s) / 86400 ))
            echo "Token active; expires $exp (in ${days} days)."
            if [ "$days" -lt 14 ]; then
              echo "::error::CLOUDFLARE_API_TOKEN expires in ${days} days — rotate it now, before deploys break."
              exit 1
            fi
          else
            echo "Token active; no expiry set."
          fi

  live-smoke:
    name: Live site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: amnesia.tax serves the SPA
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://amnesia.tax)
          [ "$code" = "200" ] || { echo "::error::https://amnesia.tax returned $code (expected 200)"; exit 1; }
          echo "amnesia.tax 200"

      - name: API gate is up
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://api.amnesia.tax/healthz)
          [ "$code" = "200" ] || { echo "::error::api.amnesia.tax/healthz returned $code (expected 200)"; exit 1; }
          echo "api/healthz 200"

      - name: Gate still enforces auth
        run: |
          set -euo pipefail
          # No cookie, no Turnstile token: the gate must refuse, not proxy.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 'https://api.amnesia.tax/search?q=test&format=json')
          [ "$code" = "401" ] || { echo "::error::unauthenticated /search returned $code (expected 401) — the gate may be open or broken"; exit 1; }
          echo "unauthenticated /search 401"

      - name: Origin refuses anything that skipped the gate
        run: |
          set -euo pipefail
          # The README says "try it" about this URL; the canary tries it daily.
          # 403 is the WAF origin-lock rule. A 200 means search-origin is
          # reachable around the gate; anything else means the origin moved.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 'https://search-origin.amnesia.tax/search?q=test')
          [ "$code" = "403" ] || { echo "::error::search-origin /search returned $code (expected 403) — the origin lock may be off"; exit 1; }
          echo "search-origin /search 403"

      - name: OpenSearch description is served (not the SPA fallback)
        run: |
          set -euo pipefail
          # Pages answers a missing file with index.html and a 200, so a
          # status check cannot see this regression; the body can.
          body=$(curl -sS --max-time 20 https://amnesia.tax/opensearch.xml)
          echo "$body" | grep -q '<OpenSearchDescription' || { echo "::error::/opensearch.xml is not an OpenSearch description (Pages served the SPA?) — 'add to browser' is broken"; exit 1; }
          echo "opensearch.xml ok"

  scorecard-floor:
    # The repo holds the fleet's highest OpenSSF Scorecard (9.5). The score is
    # recomputed on every push to main and weekly, and most ways to lower it
    # are merges nobody meant as score changes: a GitHub release without
    # provenance (Signed-Releases goes from unscored to 8 and the overall to
    # 9.4), an advisory landing on a dev dependency, a direct push. Fail loudly
    # the day it happens instead of finding out from the badge.
    name: Scorecard has not dropped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Overall at least 9.5, and no 10 has slipped
        env:
          FLOOR: '9.5'
          # Checks at 10 as of 2026-09-22. The four below 10 are ceilings a
          # solo-maintained repo cannot lift honestly (Branch-Protection 8,
          # Contributors 3, CII-Best-Practices 5); they are not listed.
          AT_TEN: >-
            Binary-Artifacts CI-Tests Code-Review Dangerous-Workflow
            Dependency-Update-Tool Fuzzing License Maintained
            Pinned-Dependencies SAST Security-Policy Token-Permissions
            Vulnerabilities
          # Unscored today (-1) and fine that way; only a 10 is acceptable
          # once they do score. Packaging turns 10 when the image workflow
          # publishes; Signed-Releases must never be scored by a release
          # that lacks provenance.
          UNSCORED_OR_TEN: Packaging Signed-Releases
        run: |
          set -euo pipefail
          curl -sSf --max-time 20 -o sc.json \
            https://api.securityscorecards.dev/projects/github.com/askalf/amnesia
          score=$(jq -r '.score' sc.json)
          echo "Scorecard $score (commit $(jq -r '.repo.commit[0:8]' sc.json), $(jq -r '.date' sc.json))"
          jq -r '.checks[] | "  \(.score)\t\(.name)"' sc.json
          fail=0
          if ! awk -v s="$score" -v f="$FLOOR" 'BEGIN { exit !(s >= f) }'; then
            echo "::error::Scorecard overall is $score, below the $FLOOR floor."
            fail=1
          fi
          for c in $AT_TEN; do
            s=$(jq -r --arg c "$c" '.checks[] | select(.name == $c) | .score' sc.json)
            if [ "$s" != "10" ]; then
              echo "::error::Scorecard $c is ${s:-missing} (was 10): $(jq -r --arg c "$c" '.checks[] | select(.name == $c) | .reason' sc.json)"
              fail=1
            fi
          done
          for c in $UNSCORED_OR_TEN; do
            s=$(jq -r --arg c "$c" '.checks[] | select(.name == $c) | .score' sc.json)
            case "$s" in
              -1|10) ;;
              *) echo "::error::Scorecard $c scored $s: $(jq -r --arg c "$c" '.checks[] | select(.name == $c) | .reason' sc.json)"; fail=1 ;;
            esac
          done
          exit "$fail"
