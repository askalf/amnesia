# Posts fleet review-lane commit statuses for pull requests.
# Reads labels, comments, reviews and checks; writes statuses. Runs a pinned askalf/ci action.
# Only the status job lives here, so every event this workflow fires on produces one check that
# runs. Its shape is checked by fleet-status-self-test.yml; the manual backfill over every open
# PR is fleet-status-backfill.yml.
# The script re-reads after posting and corrects what differs, so the last run to act leaves current
# statuses. Runs a workflow_run fires (one per finishing workflow, most of this workflow's runs) are
# grouped per PR branch and triggering event, and a newer one cancels an older (so a finished push
# run never cancels a pull request's). Their check runs sit on the default branch, not on the PR, so
# a cancelled one marks nothing on the PR. A pull_request or pull_request_review run's check run is
# on the PR, where a cancelled run rolls up as a failed check, so each of those runs alone and is
# never cancelled. An issue_comment run's check run also sits on the default branch, but comments
# are not the burst the group batches, so each of those runs alone too.
name: Fleet status

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['Fleet status self-test', 'Fleet review relay', CI, CodeQL, Image, labels, 'PR triage', Redline, Fuzz, 'ClusterFuzzLite coverage', 'Public text']
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('fleet-status-{0}-{1}-{2}', github.event.workflow_run.event, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || format('fleet-status-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  status:
    # Constraint on every path, and why a fork PR may run here: no step checks out or executes
    # PR head code. The one step is a pinned askalf/ci action that checks out
    # nothing and only calls the REST API.
    # A fork PR runs only on events that run the default branch's workflow with a write token:
    # issue_comment, and workflow_run after a fork run of a listed workflow (its CI, or
    # 'Fleet review relay' for a review). A fork's pull_request and pull_request_review events run
    # the PR merge ref's workflow with a read-only token, so they never run this job.
    # A fork's workflow_run lists no pull requests; the script finds them by head repo and branch.
    # issue_comment fires for issues too; only PR comments matter. The script re-checks it.
    # Only verification comments need the status job. Check the previous body too so an edit away
    # from the heading still refreshes statuses; a deletion's event carries the deleted body.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       (startsWith(github.event.comment.body, '## Verification at') ||
        startsWith(github.event.changes.body.from, '## Verification at'))) ||
      (github.event_name == 'workflow_run' &&
       ((contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event) &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.pull_requests[0] != null) ||
        (contains(fromJSON('["pull_request","pull_request_target","pull_request_review"]'), github.event.workflow_run.event) &&
         github.event.workflow_run.head_repository.full_name != github.repository))) ||
      (github.event_name != 'issue_comment' && github.event_name != 'workflow_run' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # On amnesia-exec for every event, a fork's included: the job runs the pinned fleet-status action
    # and never PR code, so GitHub's hosted queue going down does not hold the fleet/verify and
    # fleet/review statuses a merge waits on.
    # A fork repository has no amnesia-exec runners, so there it runs on GitHub's.
    runs-on: ${{ github.repository == 'askalf/amnesia' && fromJSON('["self-hosted","amnesia-exec"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/ci/actions/fleet-status@6290c052b725054b09d45ecbeb6664194a778c79 # main 2026-10-24, askalf/ci#129
        with:
          pr: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          head-repo: ${{ github.event.workflow_run.head_repository.full_name }}
          head-branch: ${{ github.event.workflow_run.head_branch }}
