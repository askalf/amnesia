name: KV create (temp)

# TEMPORARY one-off, safe to delete after use.
# The askalf/landing CI token is Pages-scoped and cannot create KV
# namespaces (its pages-config-apply run failed with auth error 10000 on
# /storage/kv/namespaces). This repo's CLOUDFLARE_API_TOKEN was minted
# 2026-06-10 for Pages+Worker deploys and likely carries Workers KV
# Storage:Edit. This workflow find-or-creates the `askalf-waitlist`
# namespace (used by askalf.org's waitlist function) and prints its ID —
# nothing amnesia-specific is touched.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: [self-hosted, amnesia]
    timeout-minutes: 2
    steps:
      - name: Find-or-create askalf-waitlist KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          LIST=$(curl -sS --max-time 15 -H "$AUTH" "$API/storage/kv/namespaces?per_page=100")
          NS_ID=$(echo "$LIST" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          if not d.get("success"):
              sys.stderr.write("KV list failed: %s\n" % json.dumps(d.get("errors")))
              sys.exit(1)
          for ns in d.get("result") or []:
              if ns.get("title") == "askalf-waitlist":
                  print(ns["id"]); break
          ')
          if [ -z "$NS_ID" ]; then
            CREATED=$(curl -sS --max-time 15 -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"title":"askalf-waitlist"}' "$API/storage/kv/namespaces")
            NS_ID=$(echo "$CREATED" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          if not d.get("success"):
              sys.stderr.write("KV create failed: %s\n" % json.dumps(d.get("errors")))
              sys.exit(1)
          print(d["result"]["id"])
          ')
            echo "created askalf-waitlist NAMESPACE_ID=$NS_ID"
          else
            echo "found existing askalf-waitlist NAMESPACE_ID=$NS_ID"
          fi
