name: Deploy API-gate Worker

# Deploys the amnesia-api-gate Cloudflare Worker (worker/) — the Turnstile gate
# in front of api.amnesia.tax. The Pages front-end deploys through Cloudflare's
# Git integration, not from here; this fires only when the worker changes (or
# on manual dispatch), so an unrelated front-end push doesn't redeploy the gate.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # A fork repository has no amnesia-exec runners, so the job stays in this repository.
    if: github.repository == 'askalf/amnesia'
    runs-on: [self-hosted, amnesia-exec]
    timeout-minutes: 5
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@da417cf6f69b3fb9a574a76fe8741e9bc1b2d9dd # main 2026-10-20, askalf/ci#76
        with:
          persist-credentials: false
      - name: Deploy amnesia-api-gate worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"  # pin wrangler (was floating @latest; no package.json); 4.100.0 was live during the last good deploy 2026-06-12
          workingDirectory: worker
          command: deploy
