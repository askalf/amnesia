name: Deploy API-gate Worker

# Deploys the amnesia-api-gate Cloudflare Worker (worker/) — the Turnstile gate
# in front of api.amnesia.tax. The Pages front-end is deployed separately by
# deploy.yml; this fires only when the worker changes (or on manual dispatch),
# so an unrelated front-end push doesn't redeploy the gate.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, amnesia]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Deploy amnesia-api-gate worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"  # pin wrangler (was floating @latest; no package.json); 4.100.0 was live during the last good deploy 2026-06-12
          workingDirectory: worker
          command: deploy
