# OpenSSF Scorecard — automated supply-chain security posture checks
# (branch protection, token permissions, pinned dependencies, CI tests, …).
# Results are published so the README badge and the public scorecard.dev API
# always reflect the current score; the SARIF also lands in code scanning.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1' # weekly (staggered per-repo)
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # required by publish_results (OIDC attestation)
    steps:
      - name: Checkout code
        uses: askalf/ci/actions/checkout-with-retry@aae8ab88a0fd614bc1a1c738cd12775cabc44904 # main 2026-10-22, askalf/ci#108
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection scores from what the job token can read: the public
          # rules of a public repo (5-8 of 10 here, not the -1 an earlier comment
          # claimed). A fine-grained PAT with `administration: read` + `metadata:
          # read` in the SCORECARD_TOKEN secret would also read the admin-only
          # settings; no repo sets one, so the fallback is the path every run takes.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
