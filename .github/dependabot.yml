version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init/analyze/upload-sarif must all run the SAME codeql-action version.
      # Ungrouped, dependabot splits one bump into a PR per sub-action, and each
      # is individually unmergeable: the Analyze step fails with "Not all workflow
      # steps that use github/codeql-action actions use the same version".
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # npm: the fuzz devDependency (@jazzer.js/core) — the only npm surface in the
  # repo (site is static, Worker is zero-dep).
  # Labels pinned: Dependabot's npm default adds `javascript`, which is not in
  # .github/labels.json, and the first such PR would auto-create it and turn
  # labels.yml (declared == live) red on main.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Keeps the digest-pinned ClusterFuzzLite base image tracking upstream —
  # OSS-Fuzz pushes new builder images often, and a stale pin would slowly
  # drift the fuzz toolchain away from what OSS-Fuzz actually supports.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"

  # The self-host image's SearXNG base (image/Dockerfile), digest-pinned.
  # A bump PR runs image.yml's build + smoke test before it can merge, and
  # the merge republishes ghcr.io/askalf/amnesia on the new base.
  - package-ecosystem: "docker"
    directory: "/image"
    schedule:
      interval: "weekly"

  # The hosted stack's digest pins (infra/docker-compose*.yml): SearXNG, which
  # image/Dockerfile must match, and gluetun, the VPN kill switch. The `docker`
  # ecosystem reads Dockerfiles only, so without this neither ever moved.
  # Labels pinned to declared ones (see the npm entry).
  - package-ecosystem: "docker-compose"
    directory: "/infra"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
      - "infra"
