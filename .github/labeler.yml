# Path → label map for .github/workflows/pr-triage.yml (actions/labeler v7).
#
# Additive only: sync-labels is off, so nothing here ever strips a label a
# human — or Dependabot — put on a PR by hand. Add a path, get a label.
#
# Bare-noun labels, matching the Own Your Stack family vocabulary (redstamp is
# the reference), so a reader moving between repos sees the same words.

worker:
  - changed-files:
      - any-glob-to-any-file:
          - 'worker/**'

site:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'infra/**'

fuzz:
  - changed-files:
      - any-glob-to-any-file:
          - 'fuzz/**'
          - '.clusterfuzzlite/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CHANGELOG.md'
          - 'CONTRIBUTING.md'
          - 'CODE_OF_CONDUCT.md'
          - 'SECURITY.md'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/PULL_REQUEST_TEMPLATE.md'

