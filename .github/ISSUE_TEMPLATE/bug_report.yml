name: Bug Report
description: Report a bug in Amnesia
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Search UI
        - SearXNG Backend
        - VPN / Gluetun
        - Nginx
        - Docker / Deployment
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Chrome 120, Firefox 121, Safari 17"
